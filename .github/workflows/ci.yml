name: Astra OS CI Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-asyncio fastapi httpx ruff black psutil requests numpy pillow

    - name: Run Avatar & Core Unit Tests
      run: |
        pytest tests/test_avatar.py -v

    - name: Verify Build Script Execution
      run: |
        python scripts/build.py
