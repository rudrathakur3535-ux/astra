name: Astra OS Release Automation

on:
  push:
    tags:
      - 'v*'

jobs:
  publish-release:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Generate Release Assets & Changelog
      run: |
        python scripts/release.py

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          astra-os-*.zip
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
